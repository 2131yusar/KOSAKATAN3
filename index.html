<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOI KADAI HARIAN N3 — Kuis Interaktif</title>
<style>
  :root{
    --washi:#f7f3ea; --washi-deep:#efe7d6; --sumi:#252220; --sumi-soft:#5a534c;
    --vermilion:#bc4a3c; --vermilion-deep:#9c3a2f; --gold:#b6904a; --indigo:#33495c;
    --good:#3f7a5c; --bad:#bc4a3c; --line:#ddd3bd; --card:#fffdf8;
    --shadow: 0 1px 2px rgba(37,34,32,.06), 0 8px 24px rgba(37,34,32,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP", "Zen Old Mincho", serif;
    background: radial-gradient(1200px 600px at 85% -10%, #fbf6e9 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #f3ead2 0%, transparent 55%), var(--washi);
    color:var(--sumi); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .stage{ max-width: 760px; margin: 0 auto; padding: 28px 18px 80px; }

  .cover{ position:relative; border-radius:18px; padding: 30px 26px 26px;
    background: linear-gradient(160deg, var(--indigo) 0%, #233140 100%);
    color: #f4ead0; overflow:hidden; box-shadow: var(--shadow); margin-bottom: 22px; }
  .cover::before{ content:""; position:absolute; inset:0;
    background-image: radial-gradient(circle at 1px 1px, rgba(244,234,208,.10) 1px, transparent 1px);
    background-size: 16px 16px; opacity:.5; }
  .cover .kicker{ position:relative; font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; letter-spacing:.18em; font-size:11px; text-transform:uppercase; color: var(--gold); margin-bottom:10px; }
  .cover h1{ position:relative; font-size: 25px; margin: 0 0 6px; line-height:1.4; font-weight: 600; }
  .cover h1 .accent{ color:#e8b96a; }
  .cover p.sub{ position:relative; font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size: 13px; color:#cdd9e2; margin: 0 0 18px; line-height:1.7; }
  .cover .stamp{ position:absolute; top:20px; right:22px; width:48px;height:48px; border:2px solid var(--vermilion); border-radius:8px; color:var(--vermilion); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; transform: rotate(-6deg); background: rgba(188,74,60,.07); }
  .cover .meta-row{ position:relative; display:flex; gap:16px; flex-wrap:wrap; font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:12px; color:#aebcc8; border-top:1px solid rgba(244,234,208,.18); padding-top:12px; margin-bottom: 4px;}
  .cover .meta-row b{ color:#f4ead0; font-weight:600;}

  .start-btn{ position:relative; margin-top:16px; display:inline-flex; align-items:center; gap:10px;
    background: var(--vermilion); color:#fff7ec; border:none;
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-weight:600; font-size:14px;
    padding: 12px 20px; border-radius: 999px; cursor:pointer;
    box-shadow: 0 6px 18px rgba(188,74,60,.35); transition: transform .15s ease, box-shadow .15s ease; }
  .start-btn:hover{ transform: translateY(-1px); }

  .top-tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .top-tabs button{ flex:1; border:1.5px solid var(--line); background:var(--card); border-radius:12px; padding:12px 8px;
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-weight:700; font-size:13px;
    color:var(--sumi-soft); cursor:pointer; transition:all .15s ease; }
  .top-tabs button.active{ border-color:var(--vermilion); background:var(--vermilion); color:#fff7ec; }

  .day-picker{ display:grid; grid-template-columns: repeat(6,1fr); gap:8px; margin-top:14px; }
  .day-picker button{ border:1.5px solid var(--line); background:var(--card); border-radius:10px; padding:10px 4px;
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:12.5px; font-weight:600;
    color:var(--sumi-soft); cursor:pointer; transition: all .15s ease; }
  .day-picker button:hover{ border-color:var(--gold); background:#fffaf0; }
  .day-picker button.active{ border-color:var(--vermilion); background:var(--vermilion); color:#fff7ec; }

  .mode-tabs{ display:flex; gap:8px; margin: 16px 0 4px; }
  .mode-tabs button{ flex:1; border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:10px;
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-weight:600; font-size:12.5px;
    color:var(--sumi-soft); cursor:pointer; }
  .mode-tabs button.active{ border-color:var(--indigo); background:var(--indigo); color:#fff; }

  .cat-picker{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .cat-picker button{ border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:9px 14px;
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:12.5px; font-weight:600;
    color:var(--sumi-soft); cursor:pointer; }
  .cat-picker button.active{ border-color:var(--vermilion); background:var(--vermilion); color:#fff7ec; }

  .progress-wrap{ position: sticky; top:0; z-index:20; background: linear-gradient(var(--washi) 78%, transparent); padding: 10px 0 14px; margin-bottom: 6px; }
  .progress-info{ display:flex; justify-content:space-between; align-items:baseline; font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:12px; color:var(--sumi-soft); margin-bottom:6px; padding: 0 2px; }
  .progress-info .sect-name{ color:var(--vermilion-deep); font-weight:700; letter-spacing:.02em;}
  .progress-track{ height:6px; background:var(--washi-deep); border-radius:99px; overflow:hidden; border:1px solid var(--line); }
  .progress-fill{ height:100%; width:0%; background: linear-gradient(90deg, var(--gold), var(--vermilion)); border-radius:99px; transition: width .4s cubic-bezier(.4,0,.2,1); }

  .card{ background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 26px 24px 22px; box-shadow: var(--shadow); animation: rise .35s ease; }
  @keyframes rise{ from{ opacity:0; transform: translateY(8px); } to{ opacity:1; transform: translateY(0); } }
  .qnum{ display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:30px; padding:0 9px; background: var(--sumi); color: var(--washi); font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:13px; font-weight:700; border-radius:7px; margin-bottom:14px; }
  .qtext{ font-size: 22px; line-height: 1.7; margin: 0 0 6px; }
  .qtext u{ text-decoration-color: var(--vermilion); text-decoration-thickness:2px; text-underline-offset:3px; }
  ruby{ ruby-align:center; }
  rt{ font-size:0.55em; color:var(--sumi-soft); font-weight:500; user-select:none; }
  .qid{ font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:14px; color:var(--sumi-soft); font-style:italic; margin: 0 0 16px; line-height:1.6; }

  .options{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .opt{ display:flex; align-items:flex-start; gap:12px; border:1.5px solid var(--line); border-radius:11px; padding: 13px 15px; cursor:pointer; background:#fffefb; transition: border-color .15s ease, background .15s ease; font-size:18px; line-height:1.6; }
  .opt:hover{ border-color: var(--gold); background: #fffaf0; }
  .opt .badge{ flex:0 0 auto; width:26px;height:26px; border-radius:50%; border:1.5px solid var(--sumi-soft); display:flex;align-items:center;justify-content:center; font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:13px; font-weight:700; color:var(--sumi-soft); margin-top:1px; }
  .opt.selected{ border-color: var(--indigo); background: #eef3f6; }
  .opt.selected .badge{ background:var(--indigo); border-color:var(--indigo); color:#fff; }
  .opt.correct{ border-color: var(--good); background: #eef6f0; }
  .opt.correct .badge{ background:var(--good); border-color:var(--good); color:#fff; }
  .opt.incorrect{ border-color: var(--bad); background: #faeeec; }
  .opt.incorrect .badge{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .opt.disabled{ cursor:default; }

  .feedback{ margin-top:16px; padding: 13px 15px; border-radius:10px; font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:16px; line-height:2.0; display:none; }
  .feedback.show{ display:block; animation: rise .25s ease; }
  .feedback.ok{ background:#eef6f0; border:1px solid var(--good); color:#234a37; }
  .feedback.ng{ background:#faeeec; border:1px solid var(--bad); color:#6e2a21; }
  .feedback .tag{ font-weight:700; margin-right:6px; }
  .fb-id{ margin-top:10px; padding-top:10px; border-top:1px solid rgba(0,0,0,.08); font-style:italic; font-size:15px; color:inherit; opacity:.85; }
  .fb-optexp{ margin-top:10px; padding:10px 12px; background:rgba(255,120,80,.10); border-left:3px solid rgba(255,120,80,.6); border-radius:6px; font-size:15px; color:inherit; }
  .fb-alloptions{ margin-top:12px; padding-top:10px; border-top:1px solid rgba(0,0,0,.08); display:flex; flex-direction:column; gap:8px; }
  .fb-opt-row{ padding:8px 10px; border-radius:6px; font-size:15px; line-height:2.0; background:rgba(0,0,0,.03); border-left:3px solid rgba(0,0,0,.15); color:inherit; }
  .fb-opt-row.fb-opt-correct{ background:rgba(60,180,90,.10); border-left:3px solid rgba(60,180,90,.7); }
  .fb-opt-row.fb-opt-picked{ background:rgba(255,80,80,.10); border-left:3px solid rgba(255,80,80,.7); }

  .navbar{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; gap:8px; }
  .nav-btn{ border:1.5px solid var(--sumi); background:transparent; color:var(--sumi); padding: 10px 16px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; transition: all .15s ease; white-space:nowrap; }
  .nav-btn:hover:not(:disabled){ background:var(--sumi); color:var(--washi); }
  .nav-btn:disabled{ opacity:.3; cursor:not-allowed; }
  .nav-btn.primary{ border-color: var(--vermilion); background: var(--vermilion); color:#fff7ec; }
  .nav-btn.primary:hover{ background: var(--vermilion-deep); }
  .nav-btn.ghost{ border-color: var(--line); color: var(--sumi-soft); }

  .jumpbar{ display:flex; flex-wrap:wrap; gap:5px; margin-top:18px; justify-content:center; max-height:120px; overflow-y:auto; padding:4px;}
  .jumpbar button{ width:26px;height:26px; border-radius:6px; border:1px solid var(--line); background:var(--card); font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:10px; color:var(--sumi-soft); cursor:pointer; }
  .jumpbar button.cur{ border-color:var(--indigo); color:var(--indigo); font-weight:700;}
  .jumpbar button.done-ok{ background:#eef6f0; border-color:var(--good); color:var(--good); }
  .jumpbar button.done-ng{ background:#faeeec; border-color:var(--bad); color:var(--bad); }

  .result-card{ background: var(--card); border:1px solid var(--line); border-radius: 18px; padding: 34px 28px; text-align:center; box-shadow:var(--shadow); }
  .result-card .ring{ width:150px;height:150px; margin: 6px auto 18px; position:relative; }
  .result-card .ring svg{ transform: rotate(-90deg); }
  .result-card .ring .pct{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; }
  .result-card .ring .pct b{ font-size:30px; line-height:1; }
  .result-card .ring .pct span{ font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:11px; color:var(--sumi-soft); margin-top:4px;}
  .result-card h2{ margin:0 0 4px; font-size:22px; }
  .result-card .comment{ font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:13.5px; color:var(--sumi-soft); margin-bottom:20px; }
  .result-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .review-list{ text-align:left; margin-top:26px; }
  .review-item{ border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .review-item .rq{ font-size:14px; margin-bottom:4px; }
  .review-item .rid{ font-size:11.5px; color:var(--sumi-soft); font-style:italic; margin-bottom:6px; }
  .review-item .ra{ font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:12px; }
  .review-item .ra.ok{ color:var(--good); }
  .review-item .ra.ng{ color:var(--bad); }

  .hidden{ display:none !important; }

  @media (max-width:480px){
    .cover h1{ font-size:19px; }
    .qtext{ font-size:19px; }
    .opt{ font-size:16px; }
    .card{ padding:20px 16px 18px; }
    .day-picker{ grid-template-columns: repeat(5,1fr); }
  }
</style>
</head>
<body>

<div class="stage">

  <!-- ===== COVER ===== -->
  <div id="cover" class="cover">
    <div class="stamp">N3</div>
    <div class="kicker">Interactive Quiz</div>
    <h1>GOI KADAI HARIAN N3<br><span class="accent">課題 ＋ 集中トレーニング</span></h1>
    <p class="sub" id="coverSub">読み込み中...</p>
    <div class="meta-row" id="coverMeta"></div>

    <div class="top-tabs">
      <button id="tabKadaiBtn" class="active" onclick="setTopTab('kadai')">課題 1〜30</button>
      <button id="tabTrainingBtn" onclick="setTopTab('training')">集中トレーニング</button>
    </div>

    <!-- KADAI controls -->
    <div id="kadaiControls">
      <div class="mode-tabs">
        <button id="modeAllBtn" class="active" onclick="setKadaiMode('all')">全課題まとめて挑戦</button>
        <button id="modePickBtn" onclick="setKadaiMode('pick')">課題を選ぶ</button>
      </div>
      <div id="dayPickerWrap" class="hidden">
        <div class="day-picker" id="dayPicker"></div>
      </div>
    </div>

    <!-- TRAINING controls -->
    <div id="trainingControls" class="hidden">
      <div class="mode-tabs">
        <button id="trAllBtn" class="active" onclick="setTrainingMode('all')">全カテゴリーまとめて挑戦</button>
        <button id="trPickBtn" onclick="setTrainingMode('pick')">カテゴリーを選ぶ</button>
      </div>
      <div id="catPickerWrap" class="hidden">
        <div class="cat-picker" id="catPicker"></div>
      </div>
    </div>

    <button class="start-btn" onclick="startQuiz()">▶ はじめる</button>
  </div>

  <!-- ===== QUIZ ===== -->
  <div id="quizArea" class="hidden">
    <div class="progress-wrap">
      <div class="progress-info">
        <span class="sect-name" id="sectName">課題1</span>
        <span id="progressText">1 / 1</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="card" id="card"></div>

    <div class="navbar">
      <button class="nav-btn ghost" onclick="backToCover()">← 選び直す</button>
      <button class="nav-btn" id="prevBtn" onclick="goPrev()">前へ</button>
      <button class="nav-btn primary" id="nextBtn" onclick="goNext()">次へ →</button>
    </div>

    <div class="jumpbar" id="jumpbar"></div>
  </div>

  <!-- ===== RESULT ===== -->
  <div id="resultArea" class="hidden">
    <div class="result-card">
      <div class="ring">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="64" fill="none" stroke="#efe7d6" stroke-width="12"/>
          <circle id="ringFg" cx="75" cy="75" r="64" fill="none" stroke="#bc4a3c" stroke-width="12" stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="402"/>
        </svg>
        <div class="pct"><b id="scorePct">0%</b><span id="scoreFrac">0 / 0</span></div>
      </div>
      <h2 id="resultTitle">お疲れ様でした</h2>
      <p class="comment" id="resultComment"></p>

      <div class="result-actions">
        <button class="nav-btn primary" onclick="showReview()">📖 解説を見る</button>
        <button class="nav-btn" onclick="restartQuiz()">↻ もう一度</button>
        <button class="nav-btn ghost" onclick="backToCover()">選び直す</button>
      </div>

      <div class="review-list hidden" id="reviewList"></div>
    </div>
  </div>

</div>

<script>

// ===== KADAI DATA (final, underlined) =====
const KADAI_DATA = [
{
  day: 1,
  groups: [
    { label: "問題1", items: [
      {q:"とても<u>悲しい</u>話を聞いた。（悲しい）", opts:["おかしい","かなしい","きびしい","さびしい"], ans:1, exp:"「<ruby>悲<rp>(</rp><rt>かな</rt><rp>)</rp></ruby>しい」＝sedih（かなしい）。", id:"Saya mendengar cerita yang sangat sedih.", optExp:["Salah: 「おかしい」＝lucu/aneh, bukan bacaan「<ruby>悲<rp>(</rp><rt>かな</rt><rp>)</rp></ruby>しい」.","✓ 「かなしい」＝sedih, bacaan yang benar untuk <ruby>悲<rp>(</rp><rt>かな</rt><rp>)</rp></ruby>しい.","Salah: 「きびしい」＝keras/tegas, bukan bacaan「<ruby>悲<rp>(</rp><rt>かな</rt><rp>)</rp></ruby>しい」.","Salah: 「さびしい」＝sepi/kesepian, bukan bacaan「<ruby>悲<rp>(</rp><rt>かな</rt><rp>)</rp></ruby>しい」."]},
      {q:"家族とよく<u>相談</u>してから決めようと思う。", opts:["そたん","そだん","そうたん","そうだん"], ans:3, exp:"「<ruby>相談<rp>(</rp><rt>そうだん</rt><rp>)</rp></ruby>」＝soudan, diskusi/konsultasi.", id:"Saya berpikir akan memutuskan setelah berdiskusi dengan keluarga dengan baik.", optExp:["Salah: 「そたん」bukan bacaan yang tepat di sini. Bacaan yang benar adalah 「そうだん」.","Salah: 「そだん」bukan bacaan yang tepat di sini. Bacaan yang benar adalah 「そうだん」.","Salah: 「そうたん」bukan bacaan yang tepat di sini. Bacaan yang benar adalah 「そうだん」.","✓ Bacaan yang benar: 「そうだん」."]},
      {q:"来⽉の<u>旅⾏</u>が楽しみだ。", opts:["りょこ","りょうこ","りょこう","りこ"], ans:2, exp:"「<ruby>旅<rp>(</rp><rt>たび</rt><rp>)</rp></ruby>⾏」＝ryokou, perjalanan.", id:"Saya menantikan perjalanan bulan depan.", optExp:["Salah: 「りょこ」bukan bacaan yang tepat di sini. Bacaan yang benar adalah 「りょこう」.","Salah: 「りょうこ」bukan bacaan yang tepat di sini. Bacaan yang benar adalah 「りょこう」.","✓ Bacaan yang benar: 「りょこう」.","Salah: 「りこ」bukan bacaan yang tepat di sini. Bacaan yang benar adalah 「りょこう」."]}
    ]},
    { label: "問題2", items: [

      {q:"本棚には、外国の本がたくさん<u>ならんで</u>いた。", opts:["並んで","兆んで","挑んで","列んで"], ans:0, exp:"「ならんで」＝「<ruby>並<rp>(</rp><rt>なら</rt><rp>)</rp></ruby>んで」, berjejer/berbaris.", id:"Di rak buku, banyak buku asing yang tersusun berjajar.", optExp:["✓ Penulisan kanji yang benar: 「<ruby>並<rp>(</rp><rt>なら</rt><rp>)</rp></ruby>んで」.","Salah: 「<ruby>兆<rp>(</rp><rt>ちょう</rt><rp>)</rp></ruby>んで」bukan penulisan yang tepat di sini. Penulisan yang benar adalah 「<ruby>並<rp>(</rp><rt>なら</rt><rp>)</rp></ruby>んで」.","Salah: 「<ruby>挑<rp>(</rp><rt>いど</rt><rp>)</rp></ruby>んで」bukan penulisan yang tepat di sini. Penulisan yang benar adalah 「<ruby>並<rp>(</rp><rt>なら</rt><rp>)</rp></ruby>んで」.","Salah: 「<ruby>列<rp>(</rp><rt>なら</rt><rp>)</rp></ruby>んで」bukan penulisan yang tepat di sini. Penulisan yang benar adalah 「<ruby>並<rp>(</rp><rt>なら</rt><rp>)</rp></ruby>んで」."]},

// ===== State =====
let topTab = 'kadai';
let kadaiMode = 'all';
let trainingMode = 'all';
// Track selections in plain JS arrays (not relying on classList query)
let _selectedDays = [];
let _selectedCats = [];
let FLAT = [];
let current = 0;
let answers = [];
let answered = [];

function setTopTab(t){
  topTab = t;
  document.getElementById('tabKadaiBtn').classList.toggle('active', t==='kadai');
  document.getElementById('tabTrainingBtn').classList.toggle('active', t==='training');
  document.getElementById('kadaiControls').classList.toggle('hidden', t!=='kadai');
  document.getElementById('trainingControls').classList.toggle('hidden', t!=='training');
}

function setKadaiMode(m){
  kadaiMode = m;
  document.getElementById('modeAllBtn').classList.toggle('active', m==='all');
  document.getElementById('modePickBtn').classList.toggle('active', m==='pick');
  document.getElementById('dayPickerWrap').classList.toggle('hidden', m!=='pick');
}

function setTrainingMode(m){
  trainingMode = m;
  document.getElementById('trAllBtn').classList.toggle('active', m==='all');
  document.getElementById('trPickBtn').classList.toggle('active', m==='pick');
  document.getElementById('catPickerWrap').classList.toggle('hidden', m!=='pick');
}

function buildDayPicker(){
  _selectedDays = [];
  const wrap = document.getElementById('dayPicker');
  wrap.innerHTML = '';
  KADAI_DATA.forEach(d => {
    const dayNum = d.day;
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = dayNum;
    b.onclick = function(){
      const idx = _selectedDays.indexOf(dayNum);
      if(idx === -1){
        _selectedDays.push(dayNum);
        this.classList.add('active');
      } else {
        _selectedDays.splice(idx, 1);
        this.classList.remove('active');
      }
    };
    wrap.appendChild(b);
  });
}

function buildCatPicker(){
  _selectedCats = [];
  const wrap = document.getElementById('catPicker');
  wrap.innerHTML = '';
  TRAINING_DATA.forEach((c, idx) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = c.cat;
    b.onclick = function(){
      const pos = _selectedCats.indexOf(idx);
      if(pos === -1){
        _selectedCats.push(idx);
        this.classList.add('active');
      } else {
        _selectedCats.splice(pos, 1);
        this.classList.remove('active');
      }
    };
    wrap.appendChild(b);
  });
}

function buildFlatKadai(daysFilter){
  const flat = [];
  KADAI_DATA.forEach(d => {
    if(daysFilter && !daysFilter.includes(d.day)) return;
    d.groups.forEach(g => {
      g.items.forEach(it => {
        flat.push({
          source:'kadai', day:d.day, groupLabel:g.label,
          q:it.q, opts:it.opts, ans:it.ans, exp:it.exp, id:it.id||'', optExp:it.optExp||null
        });
      });
    });
  });
  return flat;
}

function buildFlatTraining(catFilter){
  const flat = [];
  TRAINING_DATA.forEach((c, idx) => {
    if(catFilter && !catFilter.includes(idx)) return;
    c.items.forEach(it => {
      flat.push({
        source:'training', cat:c.cat,
        q:it.q, opts:it.opts, ans:it.ans, exp:it.exp, id:it.id||'', optExp:it.optExp||null
      });
    });
  });
  return flat;
}

function updateCoverInfo(){
  const totalKadai = buildFlatKadai(null).length;
  const totalTraining = buildFlatTraining(null).length;
  const totalDays = KADAI_DATA.length;
  document.getElementById('coverSub').textContent = '文字・語彙・表現・敬語などの問題を1問ずつ解いて、その場で解説と和訳を確認できます。タブで「課題」か「集中トレーニング」を選んでください。';
  document.getElementById('coverMeta').innerHTML =
    '<div><b>'+totalKadai+'問</b> 課題</div><div><b>'+totalDays+'</b> 日分</div><div><b>'+totalTraining+'問</b> トレーニング</div>';
}

function startQuiz(){
  if(topTab === 'kadai'){
    let daysFilter = null;
    if(kadaiMode === 'pick'){
      if(_selectedDays.length === 0){ alert('少なくとも1つの課題を選んでください。'); return; }
      daysFilter = _selectedDays.slice().sort((a,b)=>a-b);
    }
    FLAT = buildFlatKadai(daysFilter);
  } else {
    let catFilter = null;
    if(trainingMode === 'pick'){
      if(_selectedCats.length === 0){ alert('少なくとも1つのカテゴリーを選んでください。'); return; }
      catFilter = _selectedCats.slice();
    }
    FLAT = buildFlatTraining(catFilter);
  }
  if(FLAT.length === 0){ alert('問題が見つかりませんでした。'); return; }

  answers = new Array(FLAT.length).fill(null);
  answered = new Array(FLAT.length).fill(false);
  current = 0;

  document.getElementById('cover').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('resultArea').classList.add('hidden');
  buildJumpbar();
  renderQuestion();
}

function backToCover(){
  document.getElementById('quizArea').classList.add('hidden');
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('cover').classList.remove('hidden');
}

function buildJumpbar(){
  const bar = document.getElementById('jumpbar');
  bar.innerHTML = '';
  FLAT.forEach((q,i)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = (i+1);
    b.id = 'jump-'+i;
    b.onclick = (function(idx){ return function(){ current = idx; renderQuestion(); }; })(i);
    bar.appendChild(b);
  });
}

function updateJumpbar(){
  FLAT.forEach((q,i)=>{
    const b = document.getElementById('jump-'+i);
    if(!b) return;
    b.className = '';
    if(i === current) b.classList.add('cur');
    if(answered[i]){
      if(answers[i] === q.ans) b.classList.add('done-ok');
      else b.classList.add('done-ng');
    }
  });
}

function renderQuestion(){
  const q = FLAT[current];
  const label = q.source === 'kadai'
    ? ('課題'+q.day+' ／ '+q.groupLabel)
    : ('集中トレーニング ／ '+q.cat);
  document.getElementById('sectName').textContent = label;
  document.getElementById('progressText').textContent = (current+1)+' / '+FLAT.length;
  document.getElementById('progressFill').style.width = ((current+1)/FLAT.length*100)+'%';

  let html = '';
  html += '<div class="qnum">問題 '+(current+1)+'</div>';
  html += '<div class="qtext">'+q.q+'</div>';
  html += '<div class="options" id="optionsWrap">';
  q.opts.forEach((opt, i)=>{
    html += '<div class="opt" data-idx="'+i+'" onclick="selectOption('+i+')">'
      + '<div class="badge">'+(i+1)+'</div>'
      + '<div>'+opt+'</div></div>';
  });
  html += '</div>';
  html += '<div class="feedback" id="feedback"></div>';

  document.getElementById('card').innerHTML = html;

  if(answered[current]){
    showFeedback(current, answers[current]);
  }

  document.getElementById('prevBtn').disabled = (current === 0);
  document.getElementById('nextBtn').textContent = (current === FLAT.length-1) ? '結果を見る ✓' : '次へ →';
  updateJumpbar();
  window.scrollTo({top:0});
}

function selectOption(i){
  if(answered[current]) return;
  answers[current] = i;
  answered[current] = true;
  showFeedback(current, i);
  updateJumpbar();
}

function showFeedback(qIdx, selectedIdx){
  const q = FLAT[qIdx];
  const opts = document.querySelectorAll('#optionsWrap .opt');
  opts.forEach(o=>{
    const idx = parseInt(o.dataset.idx);
    o.classList.add('disabled');
    if(idx === q.ans) o.classList.add('correct');
    else if(idx === selectedIdx) o.classList.add('incorrect');
    if(idx === selectedIdx) o.classList.add('selected');
  });
  const fb = document.getElementById('feedback');
  const isCorrect = selectedIdx === q.ans;
  fb.className = 'feedback show ' + (isCorrect ? 'ok' : 'ng');
  // penjelasan + terjemahan Indonesia digabung di sini
  let fbHtml = '<span class="tag">'+(isCorrect ? '✓ 正解！' : '✗ 不正解')+'</span>';
  fbHtml += '正解は「'+(q.ans+1)+'. '+q.opts[q.ans]+'」<br><br>';
  fbHtml += q.exp;
  if(q.id){
    fbHtml += '<div class="fb-id">🇮🇩 '+q.id+'</div>';
  }
  // Tampilkan penjelasan untuk SEMUA 4 pilihan (bukan hanya yang dipilih)
  if(q.optExp && q.optExp.length === q.opts.length){
    fbHtml += '<div class="fb-alloptions">';
    q.opts.forEach((optText, idx)=>{
      const isAns = idx === q.ans;
      const isPicked = idx === selectedIdx;
      let rowClass = 'fb-opt-row' + (isAns ? ' fb-opt-correct' : '') + (isPicked && !isAns ? ' fb-opt-picked' : '');
      let marker = isAns ? '✓' : (isPicked ? '✗' : '　');
      fbHtml += '<div class="'+rowClass+'"><b>'+marker+' '+(idx+1)+'. '+optText+'</b><br>'+q.optExp[idx]+'</div>';
    });
    fbHtml += '</div>';
  }
  fb.innerHTML = fbHtml;
}

function goNext(){
  if(current === FLAT.length-1){ showResult(); return; }
  current++;
  renderQuestion();
}
function goPrev(){
  if(current === 0) return;
  current--;
  renderQuestion();
}

function showResult(){
  document.getElementById('quizArea').classList.add('hidden');
  document.getElementById('resultArea').classList.remove('hidden');

  const total = FLAT.length;
  const correct = FLAT.reduce((acc,q,i)=> acc+(answers[i]===q.ans?1:0), 0);
  const pct = Math.round(correct/total*100);

  document.getElementById('scorePct').textContent = pct+'%';
  document.getElementById('scoreFrac').textContent = correct+' / '+total;

  const circ = 2*Math.PI*64;
  const ring = document.getElementById('ringFg');
  ring.setAttribute('stroke-dasharray', circ);
  ring.style.transition = 'stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)';
  setTimeout(()=>{ ring.setAttribute('stroke-dashoffset', circ-(pct/100)*circ); }, 100);

  let title, comment;
  if(pct>=80){ title='素晴らしい！'; comment='N3レベルの語彙・表現がしっかり身についています。'; }
  else if(pct>=60){ title='もう少しです'; comment='間違えた問題の解説を読んで、弱点を補強しましょう。'; }
  else if(pct>=40){ title='伸びしろがあります'; comment='解説を見ながら、間違えたパターンを覚えていきましょう。'; }
  else { title='これからが本番です'; comment='焦らず一つずつ、繰り返し復習していきましょう。'; }
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultComment').textContent = comment;
}

function showReview(){
  const list = document.getElementById('reviewList');
  list.classList.remove('hidden');
  let html = '';
  FLAT.forEach((q,i)=>{
    const isCorrect = answers[i] === q.ans;
    const userAns = answers[i]===null ? '(未回答)' : (answers[i]+1)+'. '+q.opts[answers[i]];
    const label = q.source==='kadai' ? '課題'+q.day : q.cat;
    html += '<div class="review-item">'
      + '<div class="rq"><b>'+(i+1)+'. ('+label+')</b> '+q.q.replace(/<[^>]+>/g,'')+'</div>'
      + '<div class="ra '+(isCorrect?'ok':'ng')+'">'+(isCorrect?'✓':'✗')+' あなたの答え: '+userAns+' ｜ 正解: '+(q.ans+1)+'. '+q.opts[q.ans]+'</div>'
      + '<div class="ra" style="color:#5a534c;margin-top:4px;">'+q.exp+'</div>'
      + (q.id ? '<div class="ra" style="color:#8a7d6a;margin-top:2px;font-style:italic;">🇮🇩 '+q.id+'</div>' : '')
      + '</div>';
  });
  list.innerHTML = html;
  list.scrollIntoView({behavior:'smooth'});
}

function restartQuiz(){
  current = 0;
  for(let i=0;i<FLAT.length;i++){ answers[i]=null; answered[i]=false; }
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('reviewList').classList.add('hidden');
  document.getElementById('reviewList').innerHTML='';
  document.getElementById('quizArea').classList.remove('hidden');
  buildJumpbar();
  renderQuestion();
}

document.addEventListener('DOMContentLoaded', function(){
  buildDayPicker();
  buildCatPicker();
  updateCoverInfo();
});

// expose to global scope for onclick handlers
window.setTopTab = setTopTab;
window.setKadaiMode = setKadaiMode;
window.setTrainingMode = setTrainingMode;
window.startQuiz = startQuiz;
window.backToCover = backToCover;
window.goPrev = goPrev;
window.goNext = goNext;
window.selectOption = selectOption;
window.showReview = showReview;
window.restartQuiz = restartQuiz;
</script>
</body>
</html>
